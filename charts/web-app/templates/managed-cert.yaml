{{- if and (.Values.enabled) (.Values.google.gke) (not .Values.local) }}

{{- if or (.Values.ingress.enabled) (.Values.ingress.cert) }}
{{- if .Values.ingress.https }}

apiVersion: networking.gke.io/v1 
kind: ManagedCertificate
metadata:
  name: google-cert
  namespace: {{ .Release.Namespace }}
  labels:
    namespace: {{ .Release.Namespace }}
    backstage.io/kubernetes-id: {{ .Values.app_code }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{ end }}
  annotations:
    configsync.gke.io/cluster-name-selector: {{ include "primary_cluster" $ }}
spec:
  domains:
    - {{ include "subdomain" . }}

{{- end }}
{{- end }}

{{- end }}
