{{- if and (.Values.enabled) (.Values.postgres.enabled) }}

apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: crunchydb
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  image: {{ .Values.postgres.image }}
  postgresVersion: {{ .Values.postgres.version }}
  {{- if .Values.postgres.monitoring }}
  monitoring:
    pgmonitor:
      exporter: {}
  {{- end }}
  {{- if .Values.postgres.init_sql }}
  databaseInitSQL:
    name: crunchydb-init-sql
    key: init.sql
  {{- end }}
  instances:
    - name: instance1
      replicas: {{ .Values.postgres.replicas }}
      {{- if .Values.linkerd.enabled }}
      metadata:
        annotations:
          linkerd.io/inject: enabled
      {{- end }}
      resources:
        {{- toYaml .Values.postgres.resources | nindent 8 }}
      dataVolumeClaimSpec:
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
        - "ReadWriteOnce"
        resources:
          requests:
            storage: {{ .Values.postgres.disk_size }}
  patroni:
    dynamicConfiguration:
      postgresql:
        pg_hba:
          - host crunchydb crunchydb 0.0.0.0/0 password
        parameters:
          max_connections: 500
  backups:
    pgbackrest:
      image: {{ .Values.postgres.backup.image }}
      repoHost:
        resources:
          {{- toYaml .Values.postgres.backup.resources | nindent 10 }}
      jobs:
        resources:
          {{- toYaml .Values.postgres.backup.resources | nindent 10 }}
      {{- with .Values.postgres.backup.s3 }}
      {{- if .enabled }}
      configuration:
        - secret:
            name: {{ required "REQUIRED: postgres.backup.s3.secret when postgres.backup.s3.enabled" .secret | quote }}
      global:
        repo2-path: /pgbackrest/{{ $.Release.Namespace }}/crunchydb/repo2
        repo2-s3-uri-style: path
        repo2-retention-full: {{ .retention.full | quote }}
        repo2-retention-full-type: count
      repos:
      - name: repo2
        s3:
          bucket: {{ required "REQUIRED: postgres.backup.s3.bucket when postgres.backup.s3.enabled" .bucket | quote }}
          endpoint: {{ .endpoint | quote }}
          region: {{ .region | quote }}
        schedules:
          full: {{ .schedules.full | quote }}
          differential: {{ .schedules.differential | quote }}
      {{- else }}
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            {{- with $.Values.postgres.storageClassName }}
            storageClassName: {{ . }}
            {{- end }}
            accessModes:
            - "ReadWriteOnce"
            resources:
              requests:
                storage: {{ $.Values.postgres.disk_size }}
      {{- end }}
      {{- end }}

{{- if .Values.postgres.init_sql }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crunchydb-init-sql
  namespace: {{ .Release.Namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  init.sql: |
{{ .Values.postgres.init_sql | indent 4 }}
{{- end }}

{{- end }}
