suite: scheduling the app's own images
templates:
  - api-dep.yaml
  - nginx-dep.yaml

set:
  enabled: true
  lifecycle: dev
  app_code: test
  domain: example.com
  google:
    region: us-central1

tests:
  - it: places the API and frontend only where the platform says their images run
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0]
          value: {key: kubernetes.io/arch, operator: In, values: [amd64]}

  - it: places them anywhere when the platform says nothing
    asserts:
      - notExists:
          path: spec.template.spec.affinity
